name: Update Galashiels School Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: galashiels-calendar-update
  cancel-in-progress: true

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Sync repository
        run: |
          git pull --rebase origin main

      - name: Update calendar
        run: python update_calendar.py

      - name: Record weekly check
        run: |
          echo "Last council website check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > last_checked.txt

      - name: Save updated calendar and check record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add galashiels-school-dates.ics last_checked.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly council calendar check"
            git push origin HEAD:main
          fi