name: Update Galashiels School Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: galashiels-calendar-update
  cancel-in-progress: true

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Update calendar
        run: python update_calendar.py

          - name: Save updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add galashiels-school-dates.ics

          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update Galashiels school calendar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi